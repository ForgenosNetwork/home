    <script>
        // Set CSS Variables dynamically from config file (Logo is safely hardcoded to orange inside UI)
        const configHex = (typeof FORGENOS_CONFIG !== 'undefined' && FORGENOS_CONFIG.brandColor) ? FORGENOS_CONFIG.brandColor : '#f97316';
        let r = parseInt(configHex.slice(1, 3), 16), g = parseInt(configHex.slice(3, 5), 16), b = parseInt(configHex.slice(5, 7), 16);
        document.documentElement.style.setProperty('--brand-color', configHex);
        document.documentElement.style.setProperty('--brand-rgb', `${r}, ${g}, ${b}`);
    </script>

    <style>
        /* 14px Scale For Crisp Premium Look */
        html { 
            font-size: 14px; 
            scroll-behavior: smooth; 
        }

        body { 
            background-color: #141414; 
            color: #e5e5e5; 
            overflow-x: hidden;

            -moz-user-select: text; 
            -ms-user-select: text; 
            user-select: text; 
        }
        
        .policy-content, .policy-content *, input, textarea {

            -moz-user-select: text !important;
            -ms-user-select: text !important;

        .lenis.lenis-stopped { overflow: hidden; }
        
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1s ease; display: none; }

        /* LOGO COLOR HARDCODED TO ORANGE (NEVER CHANGES) */

        .brand-logo-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.04em; background: linear-gradient(180deg, #ffffff 0%, #a0a0aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 0.1em; display: inline-block; line-height: 1.1; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-color); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .skeleton-bg { background: #1c1c1c; animation: skeletonPulse 1.8s ease-in-out infinite; }
        @keyframes skeletonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .rolling-wrapper-inline { height: 1.1em; overflow: hidden; position: relative; display: inline-flex; vertical-align: bottom; }
        .rolling-list-inline { margin: 0; padding: 0; list-style: none; will-change: transform; display: flex; flex-direction: column; width: 100%; }
        .rolling-list-inline li { height: 1.1em; display: flex; align-items: center; white-space: nowrap; }

        /* GRID CARDS ONLY */
        .premium-card { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: linear-gradient(145deg, #1c1c1e 0%, #09090b 100%) !important; 
            border: 1px solid rgba(255, 255, 255, 0.12) !important; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05) !important; 
            display: flex !important; flex-direction: column !important; height: 100% !important; width: 100% !important; 
        }
        @media (min-width: 1024px) { 
            .premium-card:not([style*="grayscale"]):hover {

                box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(var(--brand-rgb),0.5) !important; 
                border-color: rgba(var(--brand-rgb), 0.4) !important; z-index: 20; 
            } 
        }
        @media (max-width: 1023px) { 
            .premium-card:not([style*="grayscale"]):active { transform: scale(0.98); border-color: rgba(var(--brand-rgb), 0.4) !important; } 
        }

        .pinned-glow { border-color: rgba(var(--brand-rgb), 0.6) !important; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(var(--brand-rgb), 0.25), inset 0 0 15px rgba(var(--brand-rgb), 0.1) !important; }

        @media (min-width: 1024px) {

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; align-items: stretch; }
        .grid-container > * { height: 100%; }

        @media(max-width: 640px) {

            .premium-card { font-size: 0.85rem; }

        #top-loader {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, var(--brand-color), #ffffff, var(--brand-color));
            background-size: 200% 100%; box-shadow: 0 0 15px rgba(var(--brand-rgb), 0.8), 0 0 5px rgba(255, 255, 255, 0.5);
            width: 0%; z-index: 99999; opacity: 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            animation: loaderFlow 1s linear infinite; pointer-events: none;
        }
        @keyframes loaderFlow { 0% { background-position: 100% 0; } 100% { background-position: -200% 0; } }

        .half-circle-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--brand-color);

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #smooth-scroll-overlay.active { opacity: 1; pointer-events: all; }
        .shimmer-text {
            font-size: 2.5rem; font-weight: bold; color: rgba(255,255,255,0.2);
            background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, #ffffff 50%, rgba(255,255,255,0.2) 100%);
            background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerSweep 1.5s infinite linear;
        }
        @keyframes shimmerSweep { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        /* Slider Snap CSS */
        .slider-snap-x { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .slider-snap-center { scroll-snap-align: center; }

        /* Additional Premium Home Page Styles */
        @keyframes speed-glow {
            0% { transform: translateX(-30%) translateY(-10%) scale(1); opacity: 0.15; }
            50% { transform: translateX(30%) translateY(5%) scale(1.2); opacity: 0.25; }
            100% { transform: translateX(-30%) translateY(-10%) scale(1); opacity: 0.15; }
        }
        .top-ambient-glow {
            position: absolute; top: -100px; left: 20%; width: 60vw; max-width: 1200px; height: 400px;
            background: radial-gradient(ellipse, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
            animation: speed-glow 8s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;

        .fade-overlay-bottom { background: linear-gradient(to top, rgba(15, 17, 19, 1) 0%, rgba(15, 17, 19, 0.7) 40%, rgba(15, 17, 19, 0) 100%); }
        .fade-overlay-br { background: linear-gradient(to top left, rgba(15, 17, 19, 1) 0%, rgba(15, 17, 19, 0.85) 30%, rgba(15, 17, 19, 0) 80%); }

        .netflix-zoom { transform: scale(50); opacity: 0; filter: blur(10px); pointer-events: none; }

        .slider-card {
            background: linear-gradient(145deg, #1a1a1c 0%, #09090b 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        @media (min-width: 1024px) {

                border-color: rgba(var(--brand-rgb), 0.4);
                box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(var(--brand-rgb),0.5);
                z-index: 20;
            }
        }
    </style>
</head>

            let icon = type === 'success' ? 'check-circle' : (type === 'alert' ? 'bell' : 'info');
            let color = type === 'success' ? 'text-green-500' : 'text-brand-accent';
            toast.innerHTML = `<i data-lucide="${icon}" class="${color} w-5 h-5"></i> <span class="font-semibold">${message}</span>`;

            requestAnimationFrame(() => toast.classList.remove('translate-y-20', 'opacity-0'));

            if (selectedText) {
                navigator.clipboard.writeText(selectedText).then(() => { window.showToast("Text Copied!", "success"); })
                .catch(() => {
                    const el = document.createElement('textarea'); el.value = selectedText; el.style.position = 'fixed'; el.style.opacity = '0';

        };

        window.ctxPasteText = async function() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    const active = document.activeElement;
                    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                        const start = active.selectionStart; const end = active.selectionEnd; const val = active.value;
                        active.value = val.substring(0, start) + text + val.substring(end);
                        active.selectionStart = active.selectionEnd = start + text.length;
                        active.dispatchEvent(new Event('input', { bubbles: true }));
                        window.showToast("Text Pasted!", "success");
                    } else { window.showToast("Click an input field first to paste", "alert"); }
                }
            } catch (err) { window.showToast("Clipboard access denied by browser", "alert"); }

        // Auto-Scroll Magic
        window.autoScrollIntervals = {};
        window.setupAutoScroll = function(containerId) {
            const el = document.getElementById(containerId);
            if (!el) return;
            let speed = 1; let direction = 1; let isHovered = false;
            el.addEventListener('mouseenter', () => isHovered = true);
            el.addEventListener('mouseleave', () => isHovered = false);
            el.addEventListener('touchstart', () => isHovered = true);
            el.addEventListener('touchend', () => { setTimeout(() => isHovered = false, 1000); });
            
            if(window.autoScrollIntervals[containerId]) clearInterval(window.autoScrollIntervals[containerId]);
            window.autoScrollIntervals[containerId] = setInterval(() => {
                if(!isHovered) {
                    el.scrollLeft += (speed * direction);
                    if(el.scrollLeft + el.clientWidth >= el.scrollWidth - 5) direction = -1;
                    else if(el.scrollLeft <= 0) direction = 1;
                }
            }, 25);
        };

        // --- 🌟 THE MAGIC: SUPER FAST SEAMLESS INVISIBLE IFRAME NAVIGATION 🌟 ---
        window.navigateSmoothly = function(url, targetView = null) {
            
            if (url.includes('/#') || url === '/' || url.endsWith('/index.html') || url === window.location.origin || url === window.location.origin + '/') {
                let view = 'home';
                if (targetView) view = targetView;
                else if (url.includes('/#')) view = url.split('#')[1];
                
                window.handleNavClick(view);
                
                if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
                    history.pushState({ view: view }, '', '/index.html#' + view);
                }
                return;
            }

            window.triggerPageLoader();
            
            // 🌊 FAST FULL PAGE BLUR LOADER 🌊
            let loaderOverlay = document.getElementById('full-page-loader');
            if(!loaderOverlay) {
                loaderOverlay = document.createElement('div');
                loaderOverlay.id = 'full-page-loader';
                // Lighter blur to avoid rendering lag on mobile
                loaderOverlay.className = 'fixed inset-0 z-[999999] bg-[#141414]/60 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-150 pointer-events-none opacity-0';
                document.body.appendChild(loaderOverlay);
            }
            
            // Inject rotating half circle spinner
            loaderOverlay.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-4">
                    <div class="half-circle-spinner shadow-[0_0_10px_rgba(var(--brand-rgb),0.5)]"></div>
                    <p class="text-white/90 font-black text-sm md:text-base tracking-[0.3em] uppercase animate-pulse transition-all">Loading workspace...</p>
                </div>
            `;
            
            // Force show instantly
            loaderOverlay.style.opacity = '1';
            loaderOverlay.style.pointerEvents = 'all';
            
            const container = document.getElementById('view-content');
            container.classList.remove('pb-10');
            container.classList.add('flex', 'flex-col'); 
            container.style.opacity = '0'; // Hide dashboard
            
            container.innerHTML = `
                <iframe id="seamless-tool-frame" src="${url}" class="w-full flex-1 border-none min-h-[calc(100vh-140px)] relative z-10 opacity-0 transition-opacity duration-150" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
            `;
            
            const iframe = document.getElementById('seamless-tool-frame');
            
            // Hide footer only while within seamless iframe, but persist otherwise
            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = 'none';

            // ⚡ THE SUPER-FAST INJECTION TRICK ⚡
            // Ye CSS ko iframe render hote hi inject kar dega, bina images load hone ka wait kiye!
            let isLoaded = false;
            let checkInterval = setInterval(() => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.head && iframeDoc.body && iframeDoc.body.innerHTML.length > 0) {
                        
                        if (!iframeDoc.getElementById('forgenos-fast-hide')) {
                            const style = iframeDoc.createElement('style');
                            style.id = 'forgenos-fast-hide';
                            style.innerHTML = `
                                #sidebar, header, #main-header, #mobile-menu, #mobile-menu-overlay, footer { display: none !important; opacity: 0 !important; visibility: hidden !important; }
                                main { margin-left: 0 !important; padding-top: 0 !important; }
                                body { background-color: transparent !important; }
                                html { overflow-y: auto !important; }
                            `;
                            iframeDoc.head.appendChild(style);
                        }

                        // Make it visible INSTANTLY
                        iframe.style.opacity = '1';
                        container.style.opacity = '1';

                        // Remove loader instantly
                        if (loaderOverlay) {
                            loaderOverlay.style.opacity = '0';
                            loaderOverlay.style.pointerEvents = 'none';
                        }

                        isLoaded = true;
                        clearInterval(checkInterval);
                    }
                } catch(e) {}
            }, 10);

            // Fallback bindings when everything actually finishes loading
            iframe.onload = () => {
                clearInterval(checkInterval);
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const iframeWin = iframe.contentWindow;
                    
                    if (!iframeDoc.getElementById('forgenos-fast-hide')) {
                        const style = iframeDoc.createElement('style');
                        style.id = 'forgenos-fast-hide';
                        style.innerHTML = `
                            #sidebar, header, #main-header, #mobile-menu, #mobile-menu-overlay, footer { display: none !important; opacity: 0 !important; visibility: hidden !important; }
                            main { margin-left: 0 !important; padding-top: 0 !important; }
                            body { background-color: transparent !important; }
                            html { overflow-y: auto !important; }
                        `;
                        iframeDoc.head.appendChild(style);
                    }
                    
                    document.title = iframeDoc.title;
                    
                    iframeWin.handleNavClick = function(v) { window.top.handleNavClick(v); };
                    iframeWin.navigateSmoothly = function(u, v) { window.top.navigateSmoothly(u, v); };
                    iframeWin.showToast = function(m, t) { window.top.showToast(m, t); };
                    
                    iframeDoc.addEventListener('click', function(e) {
                        const link = e.target.closest('a');
                        if (link && link.href && !link.target && !link.hasAttribute('download')) {
                            const targetUrl = new URL(link.href);
                            if (targetUrl.origin === window.location.origin) {
                                e.preventDefault();
                                window.top.navigateSmoothly(link.href);
                            }
                        }
                    });

                } catch(err) {
                    console.warn('Seamless DOM restriction (Tools will still work fine)', err);
                }
                
                if (!isLoaded) {
                    iframe.style.opacity = '1';
                    container.style.opacity = '1';
                    if (loaderOverlay) {
                        loaderOverlay.style.opacity = '0';
                        loaderOverlay.style.pointerEvents = 'none';
                    }
                }
                
                if (window.location.href !== url) {
                    history.pushState({ isSeamless: true, url: url }, document.title, url);
                }
                
                currentView = 'external-tool';
                window.renderSidebar();
                
                document.body.style.overflow = 'hidden';
            };
        };

        // Standard Navigation links interception
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href) {
                const url = new URL(target.href);
                if (url.origin === window.location.origin && 
                    !target.getAttribute('target') && 
                    !target.hasAttribute('download')) {
                    
                    e.preventDefault(); 
                    window.navigateSmoothly(target.href); 
                }
            }
        });

        // Browser Back/Forward buttons smoothly handled
        window.addEventListener('popstate', (e) => { 
            if (e.state && e.state.isSeamless) {
                window.navigateSmoothly(e.state.url);
            } else if(e.state && e.state.view) {
                window.handleNavClick(e.state.view, true); 
            } else {
                const hash = window.location.hash.substring(1);
                if(hash) window.handleNavClick(hash, true);
                else window.handleNavClick('home', true); 
            }
        });
        
        window.handleNavClick = function(view, isPopState=false) {
            if(currentView === view && view !== 'projects' && view !== 'home') return;
            if(!isPopState) {
                if(window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
                    history.pushState({view: view}, '', '/index.html#'+view);
                } else {
                    history.pushState({view: view}, '', '#'+view);
                }
            }
            
            // Wapas home aane par scrollbar aur padding thik karo
            document.body.style.overflow = ''; 
            const container = document.getElementById('view-content');
            container.classList.add('pb-10');
            container.classList.remove('flex', 'flex-col');
            
            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = 'block'; // Always visible on internal views!
            
            window.triggerPageLoader();
            currentView = view;
            window.renderSidebar();
            window.scrollTo({top: 0, behavior: 'smooth'});

            if(heroInterval) { clearInterval(heroInterval); heroInterval = null; }
            if(heroTextInterval) { clearInterval(heroTextInterval); heroTextInterval = null; }
            
            const renderView = () => {
                try {
                    if(view === 'home') window.renderHome();
                    else if(view === 'saved') window.renderSavedView();
                    else if(view === 'projects') window.renderProjectsView();
                    else if(view === 'privacy') { window.location.href = '/privacy-policy'; return; } 
                    else if(view === 'terms') { window.location.href = '/terms-of-service'; return; } 
                    else if(view === 'about') { window.location.href = '/about'; return; } 
                    else if(view === 'contact') { window.location.href = '/contact'; return; }
                    else if(view.startsWith('tool-')) window.renderToolDetailPage(parseInt(view.split('-')[1]));
                    else window.renderCategoryPage(view);
                } catch(e) {
                    console.error("Render Error:", e);
                    if(view !== 'home') window.renderHome();
                }
            };

            if(typeof gsap !== 'undefined') {
                gsap.to(container, {
                    opacity: 0, y: 20, duration: 0.2, 
                    onComplete: () => {
                        renderView();
                        
                        container.style.opacity = '1';
                        gsap.to(container, { y: 0, duration: 0.4 });
                        
                        const cards = document.querySelectorAll('.premium-card, .animate-fade-up');
                        cards.forEach((c, i) => {
                            c.style.opacity = '0';
                            c.style.animationDelay = `${i * 0.03}s`;
                            c.classList.add('animate-fade-up');
                        });
                    }
                });
            } else {
                renderView();
                container.style.opacity = '1'; 
                container.style.transform = 'translateY(0)';
            }
        };

        window.performInlineSearch = function() {
            const input = document.getElementById('inline-search-input');
            const clearBtn = document.getElementById('inline-search-clear');
            const resultsArea = document.getElementById('search-results-area');
            const resultsGrid = document.getElementById('search-results-grid');
            const emptyState = document.getElementById('search-results-empty');
            const mainContent = document.getElementById('home-main-content');
            const countText = document.getElementById('search-results-count');
            
            if(!input || !resultsArea) return;
            const query = input.value.toLowerCase().trim();
            
            if (query.length > 0) {
                if(clearBtn) clearBtn.style.display = 'block';
                resultsArea.classList.remove('hidden');
                if(mainContent) mainContent.classList.add('hidden'); 
                
                const filtered = typeof toolsData !== 'undefined' ? toolsData.filter(t => t.title.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query) || t.category.toLowerCase().includes(query) || t.tags.some(tag => tag.toLowerCase().includes(query))) : [];
                if(countText) countText.innerText = `${filtered.length} found`;

                if(filtered.length === 0) {
                    if(emptyState) {
                        resultsGrid.innerHTML = ''; emptyState.style.display = 'flex'; emptyState.classList.remove('hidden');
                    } else {
                        resultsGrid.innerHTML = '<div class="col-span-full py-10 text-center text-gray-400">No tools found matching your search.</div>';
                    }
                } else {
                    if(emptyState) { emptyState.style.display = 'none'; emptyState.classList.add('hidden'); }
                    resultsGrid.innerHTML = filtered.map((t) => `<div>${window.createCard(t)}</div>`).join('');
                    window.tryCreateIcons();
                }
            } else { window.closeInlineSearch(); }
        };
        
        window.closeInlineSearch = function() {
            const input = document.getElementById('inline-search-input');
            const clearBtn = document.getElementById('inline-search-clear');
            const resultsArea = document.getElementById('search-results-area');
            const mainContent = document.getElementById('home-main-content');
            
            if(input) input.value = '';
            if(clearBtn) clearBtn.style.display = 'none';
            if(resultsArea) resultsArea.classList.add('hidden');
            if(mainContent) mainContent.classList.remove('hidden');
        };

        window.togglePin = function(event, id) {
            if(event){ event.preventDefault(); event.stopPropagation(); }
            if(pinnedTools.includes(id)){
                pinnedTools = pinnedTools.filter(i => i !== id);
                window.showToast("Tool Unpinned", 'alert');
            } else {
                if(pinnedTools.length >= 5){ window.showToast("You can only pin up to 5 tools!", 'alert'); return; }
                pinnedTools.push(id);
                window.showToast("Tool Pinned!", 'success');
            }
            localStorage.setItem('forgenos_pinned', JSON.stringify(pinnedTools));
            if(currentView === 'home') window.renderHome(); else window.updateCardButtons(id);
        };

        window.toggleSave = function(event, id) {
            if(event){ event.preventDefault(); event.stopPropagation(); }
            if(savedTools.includes(id)){
                savedTools = savedTools.filter(i => i !== id);
                window.showToast("Removed from My List", 'alert');
            } else {
                savedTools.push(id);
                window.showToast("Added to My List", 'success');
            }
            localStorage.setItem('forgenos_saved', JSON.stringify(savedTools));
            if(currentView === 'saved') window.renderSavedView(); else window.updateCardButtons(id);
        };

                    else { icon.classList.remove('fill-brand-accent','text-brand-accent'); icon.classList.add('text-white'); }
                }
            });
            const saveBtns = document.querySelectorAll(`[data-save-btn="${id}"]`);
            saveBtns.forEach(btn => {
                const icon = btn.querySelector('svg') || btn.querySelector('i');
                if(icon){

                    else { icon.classList.remove('fill-brand-accent','text-brand-accent'); icon.classList.add('text-white'); }

            });

            const cardGlowClass = (!isSelectMode && isPinnedSection) ? 'pinned-glow' : '';

            let fetchUrl = tool.link || '';
            if (fetchUrl && !fetchUrl.endsWith('.html') && !fetchUrl.includes('#') && !fetchUrl.includes('?')) {
                fetchUrl = fetchUrl + ".html";
            }

            return `
            <div class="premium-card ${cardGlowClass} rounded-2xl overflow-hidden flex flex-col group ${isSelectMode && isSelected ? 'border-brand-accent ring-1 ring-brand-accent' : ''}" onclick="${cardAction}" style="${isDisabled ? 'filter: grayscale(100%); pointer-events: auto;' : ''}">
                <div class="card-image-wrapper ${isDisabled ? 'cursor-not-allowed' : 'cursor-pointer'} skeleton-bg" onclick="${clickImageAction}">
                    <img src="${tool.img}" loading="lazy" decoding="async" onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('skeleton-bg'); this.parentElement.classList.add('img-loaded'); this.parentElement.style.animation = 'none';" class="card-image w-full h-full object-cover opacity-0" style="transition: opacity 0.5s ease;" alt="${tool.title}">
                    ${isDisabled ? `<div class="absolute inset-0 bg-black/50 z-[15] pointer-events-none"></div>` : ''}

                    <div class="absolute top-0 left-0 bg-[#27272a] border-b border-r border-white/10 text-gray-300 text-[10px] md:text-[11px] font-black px-4 py-1.5 rounded-br-2xl z-20 shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex items-center gap-1">
                        <i data-lucide="ban" class="w-3 h-3 fill-gray-300 text-gray-300"></i> DISABLED
                    </div>` : (isPinnedSection ? `
                    <div class="absolute top-0 left-0 bg-brand-accent text-white text-[10px] md:text-[11px] font-black px-4 py-1.5 rounded-br-2xl z-20 shadow-[0_5px_15px_rgba(var(--brand-rgb),0.5)] flex items-center gap-1">

                        ${tool.tags.includes('new') ? `<span class="bg-brand-accent text-white text-[8px] md:text-[9px] font-black px-2 py-1 rounded tracking-tighter shadow-xl">NEW</span>` : ''}

                                    <img src="${coverImage}" loading="lazy" decoding="async" onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('skeleton-bg'); this.parentElement.classList.add('img-loaded'); this.parentElement.style.animation = 'none';" class="w-full h-full object-cover opacity-0 transition-transform group-hover:scale-105" style="transition: opacity 0.5s ease;" alt="Toolkit Cover">
                                </div>
                            </div>
                            <div class="w-full bg-[#1c1c1e] hover:bg-[#27272a] border border-white/5 rounded-xl py-3 px-4 flex justify-center items-center gap-2 transition-colors text-white shadow-lg">
                                <span class="text-sm font-bold">View Tools</span><i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                            </div>
                        </button>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
            document.getElementById('view-content').innerHTML = html;
            window.tryCreateIcons();
        };

        window.viewProjectTools = function(projId) {
            currentOpenProjectId = projId;
            const proj = myProjects.find(p => p.id === projId);
            if(!proj) return;
            const tools = typeof toolsData !== 'undefined' ? toolsData.filter(t => proj.toolIds.includes(t.id)) : [];

            document.getElementById('inner-project-title').innerText = proj.name;
            document.getElementById('inner-project-grid').innerHTML = tools.map((t, i) => `<div class="opacity-0 translate-y-4" style="animation: fadeUp 0.4s ease-out ${i*0.03}s forwards">${window.createCard(t)}</div>`).join('');
            
            window.tryCreateIcons();
            const modal = document.getElementById('inner-project-modal');
            window.lockScroll();
            modal.classList.remove('hidden');
            if(typeof gsap !== 'undefined'){
                gsap.to('#inner-project-header', { scale: 1, opacity: 1, duration: 0.3, ease: "out" });
                gsap.to('#inner-project-grid', { scale: 1, opacity: 1, duration: 0.4, ease: "out", delay: 0.1 });
            }
        };

        window.closeInnerProject = function() {
            const modal = document.getElementById('inner-project-modal');
            window.unlockScroll();
            if(typeof gsap !== 'undefined') { 
                gsap.to(['#inner-project-header', '#inner-project-grid'], { scale: 0.95, opacity: 0, duration: 0.2, onComplete: () => { modal.classList.add('hidden'); currentOpenProjectId = null; }}) 
            } else { 
                modal.classList.add('hidden'); currentOpenProjectId = null; 
            }
        };

        window.renderSavedView = function() { 
            const tools = typeof toolsData !== 'undefined' ? toolsData.filter(t => savedTools.includes(t.id)) : [];
            document.getElementById('view-content').innerHTML = `
                <div class="sticky top-[84px] z-30 bg-[#141414]/90 backdrop-blur-xl border-b border-white/5 shadow-[0_10px_30px_rgba(0,0,0,0.5)] px-6 md:px-16 py-6 md:py-8 transition-all">
                    <div class="w-full max-w-7xl text-left">
                        <h1 class="text-3xl md:text-6xl font-black text-white tracking-tighter leading-none">My List</h1>
                        <p class="text-gray-400 text-sm md:text-lg mt-2 md:mt-4 font-medium">Quick access to your most important tools.</p>
                    </div>
                </div>
                <div class="px-6 md:px-16 py-8 md:py-12">
                    ${tools.length === 0 ? `
                        <div class="py-32 flex flex-col items-center opacity-40 text-center">
                            <i data-lucide="bookmark" class="w-20 h-20 mb-6 text-white"></i>
                            <h2 class="text-2xl font-bold text-white">Your list is empty</h2>
                        </div>` : 
                        `<div class="grid-container text-left justify-start">${tools.map(t => `<div class="animate-fade-up opacity-0">${window.createCard(t)}</div>`).join('')}</div>`
                    }
                </div>`;
            
            const cards = document.querySelectorAll('.animate-fade-up');
            cards.forEach((c, i) => c.style.animationDelay = `${i * 0.03}s`);
            window.tryCreateIcons();
        };

        window.toggleSetting = function(key) { 
            appSettings[key] = !appSettings[key]; 
            localStorage.setItem('forgenos_settings', JSON.stringify(appSettings)); 
            
            if (key === 'smoothScroll') {
                const overlay = document.getElementById('smooth-scroll-overlay');
                if(overlay) overlay.classList.add('active');
                
                Array.from(document.body.children).forEach(el => {
                    if(el.id !== 'smooth-scroll-overlay' && el.tagName !== 'SCRIPT' && el.tagName !== 'NOSCRIPT' && el.id !== 'toast-container') {
                        el.style.transition = 'filter 0.3s ease';
                        el.style.filter = 'blur(16px)';
                    }
                });
                
                setTimeout(() => { location.reload(); }, 2500);
            } else {
                window.applyImmediateSettings(); 
            }
        };

        window.applyImmediateSettings = function() {
            if (appSettings.privacyBlur) { 
                window.onblur = () => document.body.classList.add('privacy-blur'); 
                window.onfocus = () => document.body.classList.remove('privacy-blur'); 
            } else { 
                window.onblur = null; window.onfocus = null; 
            }
            const canvas = document.getElementById('particle-canvas');
            if (appSettings.interactiveBg) { 
                canvas.style.display = 'block';
                canvas.style.opacity = '1'; 
                window.initParticles(); 
            } else { 
                canvas.style.opacity = '0'; 
                setTimeout(() => { canvas.style.display = 'none'; }, 1000);
            }
        };

        window.openCreateProjectModal = function() { 
            selectedToolsForProject = []; document.getElementById('project-name-input').value = ''; 
            document.getElementById('modal-tool-search').value = ''; 
            window.renderToolSelectionGrid(); window.updateSelectedToolsList(); 
            const modal = document.getElementById('project-modal'); 
            window.lockScroll(); 
            modal.classList.remove('hidden'); 
            if(typeof gsap !== 'undefined') gsap.to(modal.firstElementChild, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }); 
        };
        
        window.closeProjectModal = function() { 
            const modal = document.getElementById('project-modal'); 
            window.unlockScroll(); 
            if(typeof gsap !== 'undefined') { gsap.to(modal.firstElementChild, { scale: 0.95, opacity: 0, duration: 0.3, onComplete: () => modal.classList.add('hidden') }); } 
            else { modal.classList.add('hidden'); }
        };

        window.filterModalTools = function() {
            const query = document.getElementById('modal-tool-search').value.toLowerCase().trim();
            const filteredTools = typeof toolsData !== 'undefined' ? toolsData.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.category.toLowerCase().includes(query) ||
                t.tags.some(tag => tag.toLowerCase().includes(query))
            ) : [];
            document.getElementById('tool-selection-grid').innerHTML = filteredTools.map(tool => window.createCard(tool, true)).join(''); 
            window.tryCreateIcons(); 
        };

        window.renderToolSelectionGrid = function() { 
            document.getElementById('tool-selection-grid').innerHTML = typeof toolsData !== 'undefined' ? toolsData.map(tool => window.createCard(tool, true)).join('') : ''; 
            window.tryCreateIcons(); 
        };

        window.toggleToolSelection = function(id) {
            const tool = typeof toolsData !== 'undefined' ? toolsData.find(t => t.id === id) : null; 
            if (tool && tool.disabled) return;
            if(selectedToolsForProject.includes(id)) selectedToolsForProject = selectedToolsForProject.filter(tid => tid !== id); 
            else selectedToolsForProject.push(id);
            window.filterModalTools(); window.updateSelectedToolsList();
        };

        window.updateSelectedToolsList = function() {
            document.getElementById('selected-count').innerText = selectedToolsForProject.length;
            const list = document.getElementById('selected-tools-list');
            if(selectedToolsForProject.length === 0) { 
                list.innerHTML = '<p class="text-gray-400 text-xs italic text-center py-6">Tap tools in the grid to add them.</p>'; 
            } else { 
                const selected = typeof toolsData !== 'undefined' ? toolsData.filter(t => selectedToolsForProject.includes(t.id)) : []; 
                list.innerHTML = selected.map(t => `<div class="flex items-center gap-3 bg-black p-3 rounded-xl border border-white/5 animate-fade-up shrink-0"><span class="text-xs font-bold text-white truncate flex-1">${t.title}</span><button aria-label="Remove Tool" onclick="window.toggleToolSelection(${t.id})" class="text-gray-500 hover:text-red-500"><i data-lucide="x" class="w-3 h-3"></i></button></div>`).join(''); 
            }
            window.tryCreateIcons();
        };

        window.saveProject = function() {
            const name = document.getElementById('project-name-input').value.trim();
            if(!name) { window.showToast("Please enter a name", "alert"); return; }
            if(selectedToolsForProject.length === 0) { window.showToast("Please select tools", "alert"); return; }
            myProjects.push({ id: Date.now(), name, toolIds: [...selectedToolsForProject] });
            localStorage.setItem('forgenos_projects', JSON.stringify(myProjects));
            window.closeProjectModal(); window.handleNavClick('projects'); window.showToast("Toolkit Created!", 'success');
        };

        window.triggerDeleteProject = function(event, id) {
            if(event) { event.stopPropagation(); }
            projectToDeleteId = id; 
            const modal = document.getElementById('delete-modal'); 
            modal.classList.remove('hidden');
            if(typeof gsap !== 'undefined') gsap.to(document.getElementById('delete-modal-content'), { scale: 1, opacity: 1, duration: 0.3 });
            
            document.getElementById('confirm-delete-btn').onclick = () => {
                myProjects = myProjects.filter(p => p.id !== projectToDeleteId); 
                localStorage.setItem('forgenos_projects', JSON.stringify(myProjects));
                window.closeDeleteModal(); 
                if(currentOpenProjectId === projectToDeleteId) { window.closeInnerProject(); } 
                window.renderProjectsView(); window.showToast("Toolkit Deleted", 'alert');
            };
        };

        window.closeDeleteModal = function() { 
            const modal = document.getElementById('delete-modal'); 
            if(typeof gsap !== 'undefined') { gsap.to(document.getElementById('delete-modal-content'), { scale: 0.9, opacity: 0, duration: 0.2, onComplete: () => { modal.classList.add('hidden'); projectToDeleteId = null; }}); } 
            else { modal.classList.add('hidden'); projectToDeleteId = null; } 
        };

        window.resetStorage = function(type) {
            if (confirm("Are you sure? This cannot be undone.")) {
                if (type === 'saved') { savedTools = []; localStorage.removeItem('forgenos_saved'); } 
                else { myProjects = []; localStorage.removeItem('forgenos_projects'); }
                window.showToast("Data Wiped", "alert");
                if (currentView === 'saved') window.renderSavedView(); else if (currentView === 'projects') window.renderProjectsView();
            }
        };

        window.initParticles = function() {
            const canvas = document.getElementById('particle-canvas'); 
            if(!canvas) return;
            const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let stars = []; let meteors = [];

            class Star {
                constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 1.0; this.alpha = Math.random() * 0.3; this.alphaChange = (Math.random() * 0.01) - 0.005; }
                draw() { this.alpha += this.alphaChange; if(this.alpha <= 0.05 || this.alpha >= 0.4) this.alphaChange *= -1; ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
            }

            class Meteor {
                constructor() { this.reset(); }
                reset() { if (Math.random() > 0.5) { this.x = Math.random() * canvas.width; this.y = -100; } else { this.x = -100; this.y = Math.random() * canvas.height; } this.length = Math.random() * 120 + 80; this.speed = Math.random() * 6 + 4; this.angle = Math.PI / 8; this.active = false; this.timer = Math.random() * 800 + 300; this.opacity = 0; this.fadeIn = true; }
                update() {
                    if(!this.active) { this.timer--; if(this.timer <= 0) this.active = true; return; }
                    this.x += this.speed * Math.cos(this.angle); this.y += this.speed * Math.sin(this.angle);
                    if (this.fadeIn) { this.opacity += 0.005; if (this.opacity >= 0.7) this.fadeIn = false; } else { this.opacity -= 0.003; }
                    if(this.x > canvas.width + 200 || this.y > canvas.height + 200 || (!this.fadeIn && this.opacity <= 0)) { this.reset(); }
                }
                draw() {
                    if(!this.active || this.opacity <= 0) return;
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                    let gradient = ctx.createLinearGradient(0, 0, -this.length, 0); gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`); gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-this.length, 0); ctx.strokeStyle = gradient; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
                }
            }

            for(let i=0; i<50; i++) stars.push(new Star()); for(let i=0; i<3; i++) meteors.push(new Meteor()); 

            function animate() { 
                if(!appSettings.interactiveBg) return; 
                ctx.clearRect(0,0,canvas.width,canvas.height); 
                stars.forEach(s => s.draw()); 
                meteors.forEach(m => { m.update(); m.draw(); }); 
                requestAnimationFrame(animate); 
            }
            animate();
        };

        window.playLogoAnim = function() {
            if (typeof gsap === 'undefined') return;
            
            // 🌟 FIXED LOGO ANIMATION 🌟
            gsap.killTweensOf('.forgenos-shape-left, .forgenos-shape-right, .forgenos-logo-svg');
            gsap.set('.forgenos-shape-left', { x: 0, y: 0 });
            gsap.set('.forgenos-shape-right', { x: 0, y: 0 });
            gsap.set('.forgenos-logo-svg', { scale: 1.15, filter: 'none' }); // Keep base scale intact

            const lefts  = document.querySelectorAll('.forgenos-shape-left');
            const rights = document.querySelectorAll('.forgenos-shape-right');
            const svgs   = document.querySelectorAll('.forgenos-logo-svg');
            
            const tl = gsap.timeline();
            tl.to(lefts,  { x: -8, y: 8,  duration: 0.18, ease: 'power2.out' })
              .to(rights, { x: 8,  y: -8, duration: 0.18, ease: 'power2.out' }, 0)
              .to(lefts,  { x: 0, y: 0, duration: 0.3, ease: 'back.out(3)' })
              .to(rights, { x: 0, y: 0, duration: 0.3, ease: 'back.out(3)' }, '-=0.3')
              .to(svgs, { scale: 1.3, filter: 'drop-shadow(0px 0px 14px rgba(249,115,22,0.6))', duration: 0.18 }, '-=0.2')
              .to(svgs, { scale: 1.15, filter: 'none', duration: 0.35, delay: 0.25, ease: 'power2.out' });
        };

        window.onload = () => {
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 1024;

            let initialView = 'home';
            if (window.location.hash) {
                const hashView = window.location.hash.substring(1);
                
                // 🌟 DIRECT URL LOAD FIX 🌟
                if (hashView.includes('/')) {
                    window.applyImmediateSettings(); 
                    window.renderSidebar();
                    window.navigateSmoothly(hashView); 
                    return; 
                }
                
                const validViews = ['home', 'projects', 'trending', 'finance', 'dev', 'student', 'brain', 'health', 'pdf', 'image', 'saved'];
                if (validViews.includes(hashView) || hashView.startsWith('tool-')) {
                    initialView = hashView;
                }
            }

            history.replaceState({view: initialView}, '', '#' + initialView);
            currentView = initialView;
            
            if(typeof Lenis !== 'undefined' && appSettings.smoothScroll && !isMobileDevice) {
                lenisInstance = new Lenis({duration:1.2, easing:(t)=>Math.min(1,1.001-Math.pow(2,-10*t)), orientation:'vertical', smoothWheel:true });
                if(typeof ScrollTrigger !== 'undefined') lenisInstance.on('scroll', ScrollTrigger.update);
                if(typeof gsap !== 'undefined') { gsap.ticker.add((time)=>{lenisInstance.raf(time*1000)}); gsap.ticker.lagSmoothing(0); }
            }
            
            window.triggerPageLoader(); 
            window.applyImmediateSettings(); 
            
            if(initialView === 'home') window.renderHome();
            else if(initialView === 'saved') window.renderSavedView();
            else if(initialView === 'projects') window.renderProjectsView();
            else if(['privacy','terms','about','contact','disclaimer'].includes(initialView)) { 
                const redirectMap = {'privacy':'/privacy-policy','terms':'/terms-of-service','about':'/about','contact':'/contact','disclaimer':'/disclaimer'}; 
                window.location.href = redirectMap[initialView] || '/'; 
            }
            else if(initialView.startsWith('tool-')) window.renderToolDetailPage(parseInt(initialView.split('-')[1]));
            else window.renderCategoryPage(initialView);

            // Force persistence on initial load
            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = 'block';

            window.renderSidebar(); 
            window.tryCreateIcons();
            window.checkAndShowAnnouncement();
        };

        window.addEventListener('resize', () => { if(appSettings.interactiveBg) window.initParticles(); });
    </script>
</body>
</html>
