        document.getElementById('app-root').innerHTML += __UI__;

        setTimeout(() => document.getElementById('app-root').classList.remove('opacity-0'), 100);

        let lenisInstance; 
        
        // Critical Icon rendering function globally bound
        window.tryCreateIcons = function() {
            if(typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        };

        window.lockScroll = function() { document.body.classList.add('scroll-locked'); };
        window.unlockScroll = function() { document.body.classList.remove('scroll-locked'); };

        window.showToast = function(message, type = 'normal') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-[#151515] border border-white/10 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 text-white text-sm transform translate-y-20 opacity-0 transition-all duration-300';
            let icon = type === 'success' ? 'check-circle' : (type === 'alert' ? 'bell' : 'info');
            toast.innerHTML = `<i data-lucide="${icon}" class="${type === 'alert' ? 'text-yellow-500' : 'text-brand-accent'} w-5 h-5"></i> <span class="font-semibold">${message}</span>`;
            container.appendChild(toast);
            window.tryCreateIcons();
            requestAnimationFrame(() => toast.classList.remove('translate-y-20', 'opacity-0'));
            setTimeout(() => { 
                toast.classList.add('translate-y-20', 'opacity-0'); 
                setTimeout(() => toast.remove(), 400); 
            }, 3500);
        };

        window.triggerPageLoader = function() {
            const loader = document.getElementById('top-loader');
            if(!loader) return;
            loader.style.opacity = '1'; loader.style.width = '0%';
            setTimeout(() => loader.style.width = '65%', 50);
            setTimeout(() => loader.style.width = '70%', 500);
            setTimeout(() => { 
                loader.style.width = '100%'; 
                setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.style.width = '0%', 300); }, 100); 
            }, 800);
        };

        // 🌟 NATIVE SPA ROUTER & SEAMLESS IFRAME ENGINE 🌟
        // Completely isolates JS scopes while looking entirely native
        window.launchNativeSPA = function(url, toolId, event) {
            if(event) { event.preventDefault(); event.stopPropagation(); }
            window.triggerPageLoader();

            const tool = typeof toolsData !== 'undefined' ? toolsData.find(t => t.id === toolId) : null;
            if(!tool) { window.location.href = url; return; }

            // Ensure Clean SEO Path (#/category/tool-name.html)
            let cleanLink = url;
            if (!cleanLink.endsWith('.html') && !cleanLink.includes('#') && !cleanLink.includes('?')) {
                cleanLink += ".html";
            }
            let safeLink = cleanLink.replace(/^[\.\/]+/, '');
            const categoryPath = tool.category || 'tools';
            const hashUrl = `#/${categoryPath}/${safeLink}`;

            history.pushState({ view: 'run-tool', id: tool.id, link: url }, '', hashUrl);

            const dashboard = document.getElementById('view-content');
            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = 'none';

            // Seamless Full-Height Injector
            dashboard.innerHTML = `
                <div class="w-full flex flex-col h-[calc(100vh-80px)] md:h-[calc(100vh-90px)] animate-fade-up">
                    <div class="px-6 md:px-16 py-4 flex-shrink-0 flex items-center justify-between border-b border-white/5 bg-[#141414]">
                        <button onclick="window.handleNavClick('tool-${tool.id}')" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm font-bold group">
                            <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Back to Details
                        </button>
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black uppercase tracking-widest text-brand-accent bg-brand-accent/10 px-2 py-1 rounded hidden md:inline-block">${tool.category}</span>
                            <h2 class="text-white font-bold text-sm md:text-base truncate max-w-[150px] md:max-w-md">${tool.title}</h2>
                        </div>
                        <button onclick="window.open('${cleanLink}', '_blank')" class="text-gray-400 hover:text-white text-xs flex items-center gap-1 font-bold">
                            <i data-lucide="external-link" class="w-3 h-3"></i> <span class="hidden md:inline">Open Native</span>
                        </button>
                    </div>
                    
                    <div class="flex-grow relative w-full h-full bg-[#141414] overflow-hidden rounded-b-xl shadow-2xl">
                        <iframe id="seamless-tool-iframe" src="${cleanLink}" class="absolute top-0 left-0 w-full h-full border-none" style="opacity: 0; transition: opacity 0.5s ease;" allow="clipboard-read; clipboard-write"></iframe>
                        
                        <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none bg-[#141414]">
                            <div class="w-10 h-10 border-4 border-white/10 border-t-brand-accent rounded-full animate-spin mb-4"></div>
                            <span class="text-xs text-gray-500 font-bold uppercase tracking-widest animate-pulse">Initializing Engine...</span>
                        </div>
                    </div>
                </div>
            `;

            window.tryCreateIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const iframe = document.getElementById('seamless-tool-iframe');
            const loader = document.getElementById('iframe-loader');

            iframe.onload = function() {
                try {
                    // Inject CSS rules directly into the external tool to hide its UI duplication.
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const style = iframeDoc.createElement('style');
                    style.innerHTML = `
                        /* FORGENOS SEAMLESS NORMALIZATION */
                        header, nav, footer, aside, .sidebar, #desktop-nav, #mobile-menu { display: none !important; }
                        body { background: transparent !important; margin: 0 !important; padding: 0 !important; min-height: 100vh; }
                        main, #main-container, #ai-tool-workspace {
                            padding-top: 1rem !important;
                            margin: 0 auto !important;
                            width: 100% !important;
                            max-width: 100% !important;
                            box-shadow: none !important;
                        }
                        ::-webkit-scrollbar { width: 6px; height: 6px; }
                        ::-webkit-scrollbar-track { background: #141414; }
                        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
                        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
                    `;
                    iframeDoc.head.appendChild(style);
                } catch (e) {
                    console.log("Iframe Cross-Origin restriction active. Displaying unmodified layout.");
                }
                
                iframe.style.opacity = '1';
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
            };
        };

        // Advanced Popstate Listener for clean URLs
        window.addEventListener('popstate', (e) => { 
            const hash = window.location.hash;
            
            // Check if it's a new clean tool route (e.g. #/image/converter.html)
            if(hash.match(/^#\/[a-zA-Z0-9_-]+\/.+\.html/)) {
                const parts = hash.split('/');
                const fileName = parts.slice(2).join('/');
                const tool = typeof toolsData !== 'undefined' ? toolsData.find(t => t.link && t.link.includes(fileName)) : null;
                if(tool) {
                    window.launchNativeSPA(tool.link, tool.id, null);
                } else {
                    window.handleNavClick('home', true);
                }
            } else if(hash.startsWith('#run-')) { // Fallback for old IDs
                const toolId = parseInt(hash.replace('#run-', ''));
                window.launchNativeSPA('', toolId, null);
            } else if(e.state && e.state.view) {
                window.handleNavClick(e.state.view, true); 
            } else {
                const view = hash.substring(1);
                if(view) window.handleNavClick(view, true);
                else window.handleNavClick('home', true); 
            }
        });
        
        window.handleNavClick = function(view, isPopState=false) {
            if(currentView === view && view !== 'projects' && view !== 'home') return;
            if(!isPopState && !view.startsWith('run-')) history.pushState({view: view}, '', '#'+view);
            
            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = (view === 'home') ? 'block' : 'none';
            
            window.triggerPageLoader();
            currentView = view;
            window.renderSidebar();
            window.scrollTo({top: 0, behavior: 'smooth'});
            
            const container = document.getElementById('view-content');
            
            if(typeof gsap !== 'undefined') {
                gsap.to(container, {
                    opacity: 0, y: 15, duration: 0.2, 
                    onComplete: () => {
                        executeRenderView(view);
                        container.style.opacity = '1';
                        gsap.to(container, { y: 0, duration: 0.3 });
                        
                        const cards = document.querySelectorAll('.premium-card, .animate-fade-up');
                        cards.forEach((c, i) => {
                            c.style.opacity = '0';
                            c.style.animationDelay = `${i * 0.03}s`;
                            c.classList.add('animate-fade-up');
                        });
                    }
                });
            } else {
                executeRenderView(view);
                container.style.opacity = '1'; 
                container.style.transform = 'translateY(0)';
            }
        };

        function executeRenderView(view) {
            if(view === 'home') window.renderHome();
            else if(view === 'settings') window.renderSettings();
            else if(view === 'saved') window.renderSavedView();
            else if(view === 'projects') window.renderProjectsView();
            else if(view.startsWith('tool-')) window.renderToolDetailPage(parseInt(view.split('-')[1]));
            else window.renderCategoryPage(view);
        }

        window.renderSidebar = function() {
            const navItems = [
                { id: 'home', icon: 'home', label: 'Home' },
                { id: 'projects', icon: 'folder-heart', label: 'Projects' },
                { id: 'finance', icon: 'dollar-sign', label: 'Finance' },
                { id: 'dev', icon: 'code-2', label: 'Dev' },
                { id: 'student', icon: 'graduation-cap', label: 'Study' },
                { id: 'pdf', icon: 'file-text', label: 'PDF' },
                { id: 'image', icon: 'image', label: 'Image' },
                { id: 'saved', icon: 'bookmark', label: 'My List' },
                { id: 'settings', icon: 'settings', label: 'Settings' }
            ];

            const navContainer = document.getElementById('desktop-nav');
            if(navContainer) {
                navContainer.innerHTML = `<div class="flex items-center gap-2 md:ml-auto">` +
                navItems.map(item => {
                    const isActive = currentView === item.id;
                    const activeBgClass = isActive ? 'bg-white/10 text-white border-white/20 shadow-inner' : 'bg-transparent text-gray-400 border-transparent hover:bg-white/5 hover:text-white';
                    return `
                    <div onclick="window.handleNavClick('${item.id}')" class="cursor-pointer flex items-center px-4 py-2 rounded-full border transition-all duration-300 group shrink-0 ${activeBgClass}">
                        <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 transition-transform duration-300 group-hover:scale-110 ${isActive ? 'text-brand-accent' : 'text-gray-400 group-hover:text-white'}"></i>
                        <span class="ml-2 font-bold text-sm whitespace-nowrap transition-colors ${isActive ? 'text-white' : 'text-gray-400 group-hover:text-white'}">${item.label}</span>
                    </div>`;
                }).join('') + `</div>`;
            }

            const mobileNavContainer = document.getElementById('mobile-nav');
            if(mobileNavContainer) {
                mobileNavContainer.innerHTML = navItems.map(item => {
                    const isActive = currentView === item.id;
                    const activeBgClass = isActive ? 'bg-white/10 text-white' : 'text-gray-400 hover:bg-white/5 hover:text-white';
                    return `
                    <div onclick="window.handleNavClick('${item.id}'); window.toggleMobileMenu();" class="cursor-pointer flex items-center gap-4 p-4 rounded-2xl transition-all duration-300 ${activeBgClass}">
                        <i data-lucide="${item.icon}" class="w-5 h-5 ${isActive ? 'text-brand-accent' : ''}"></i>
                        <span class="font-bold text-base">${item.label}</span>
                    </div>`;
                }).join('');
            }
            window.tryCreateIcons();
        };

        window.toggleMobileMenu = function() {
            const m = document.getElementById('mobile-menu');
            const o = document.getElementById('mobile-menu-overlay');
            if(m.classList.contains('translate-x-full')) {
                window.lockScroll();
                o.classList.remove('hidden'); void o.offsetWidth; o.classList.add('opacity-100');
                m.classList.remove('translate-x-full');
            } else {
                window.unlockScroll();
                o.classList.remove('opacity-100'); m.classList.add('translate-x-full');
                setTimeout(() => o.classList.add('hidden'), 300);
            }
        };

        window.performInlineSearch = function() {
            const input = document.getElementById('inline-search-input');
            const resultsArea = document.getElementById('search-results-area');
            const resultsGrid = document.getElementById('search-results-grid');
            const mainContent = document.getElementById('home-main-content');
            
            if(!input || !resultsArea) return;
            const query = input.value.toLowerCase().trim();
            
            if (query.length > 0) {
                resultsArea.classList.remove('hidden');
                if(mainContent) mainContent.classList.add('hidden'); 
                
                const filtered = typeof toolsData !== 'undefined' ? toolsData.filter(t => t.title.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query) || t.category.toLowerCase().includes(query)) : [];
                resultsGrid.innerHTML = filtered.map((t) => `<div>${window.createCard(t)}</div>`).join('');
                window.tryCreateIcons();
            } else { window.closeInlineSearch(); }
        };
        
        window.closeInlineSearch = function() {
            const input = document.getElementById('inline-search-input');
            const resultsArea = document.getElementById('search-results-area');
            const mainContent = document.getElementById('home-main-content');
            
            if(input) input.value = '';
            if(resultsArea) resultsArea.classList.add('hidden');
            if(mainContent) mainContent.classList.remove('hidden');
        };

        window.showDisabledModal = function(reason) {
            document.getElementById('disabled-modal-reason').innerText=reason||"This tool is currently unavailable.";
            const modal = document.getElementById('disabled-modal');
            modal.classList.remove('hidden'); window.lockScroll();
            if(typeof gsap !== 'undefined') gsap.to(document.getElementById('disabled-modal-content'),{scale:1,opacity:1,duration:0.3});
        };
        
        window.closeDisabledModal = function() {
            const modal = document.getElementById('disabled-modal'); window.unlockScroll();
            if(typeof gsap !== 'undefined') gsap.to(document.getElementById('disabled-modal-content'),{scale:0.95,opacity:0,duration:0.2,onComplete:()=>{modal.classList.add('hidden')}});
            else modal.classList.add('hidden');
        };

        window.togglePin = function(event, id) {
            if(event){ event.preventDefault(); event.stopPropagation(); }
            if(pinnedTools.includes(id)){
                pinnedTools = pinnedTools.filter(i => i !== id);
                window.showToast("Tool Unpinned", 'alert');
            } else {
                if(pinnedTools.length >= 5){ window.showToast("You can only pin up to 5 tools!", 'alert'); return; }
                pinnedTools.push(id);
                window.showToast("Tool Pinned!", 'success');
            }
            localStorage.setItem('forgenos_pinned', JSON.stringify(pinnedTools));
            if(currentView === 'home') window.renderHome(); 
        };

        window.toggleSave = function(event, id) {
            if(event){ event.preventDefault(); event.stopPropagation(); }
            if(savedTools.includes(id)){
                savedTools = savedTools.filter(i => i !== id);
                window.showToast("Removed from My List", 'alert');
            } else {
                savedTools.push(id);
                window.showToast("Added to My List", 'success');
            }
            localStorage.setItem('forgenos_saved', JSON.stringify(savedTools));
            if(currentView === 'saved') window.renderSavedView();
        };

        window.createCard = function(tool, isSelectMode = false, isPinnedSection = false) {
            const isSaved = savedTools.includes(tool.id);
            const isPinned = pinnedTools.includes(tool.id);
            const isDisabled = tool.disabled === true;
            
            let cardAction = isSelectMode ? `window.toggleToolSelection(${tool.id})` : ``;
            let clickImageAction = !isSelectMode ? `window.handleNavClick('tool-${tool.id}')` : '';

            if (isDisabled) { cardAction = ''; clickImageAction = ''; }

            const cardGlowClass = (!isSelectMode && isPinnedSection) ? 'pinned-glow' : '';

            return `
            <div class="premium-card ${cardGlowClass} rounded-2xl overflow-hidden flex flex-col group" onclick="${cardAction}" style="${isDisabled ? 'filter: grayscale(100%); pointer-events: auto;' : ''}">
                <div class="card-image-wrapper ${isDisabled ? 'cursor-not-allowed' : 'cursor-pointer'} skeleton-bg" onclick="${clickImageAction}">
                    <img src="${tool.img}" loading="lazy" onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('skeleton-bg');" class="card-image w-full h-full object-cover opacity-0" style="transition: opacity 0.5s ease;" alt="${tool.title}">
                    
                    <div class="absolute top-3 right-3 md:top-4 md:right-4 flex flex-col gap-2 z-30 transition-all duration-300">
                        <button aria-label="Pin Tool" ${isDisabled ? 'disabled' : `onclick="window.togglePin(event, ${tool.id})"`} class="p-2 rounded-xl bg-black/40 backdrop-blur-md border border-white/10 hover:bg-white hover:text-black transition-all"><i data-lucide="pin" class="w-3 h-3 md:w-4 md:h-4 ${isPinned ? 'fill-brand-accent text-brand-accent' : 'text-white'}"></i></button>
                        <button aria-label="Save Tool" ${isDisabled ? 'disabled' : `onclick="window.toggleSave(event, ${tool.id})"`} class="p-2 rounded-xl bg-black/40 backdrop-blur-md border border-white/10 hover:bg-white hover:text-black transition-all"><i data-lucide="bookmark" class="w-3 h-3 md:w-4 md:h-4 ${isSaved ? 'fill-brand-accent text-brand-accent' : 'text-white'}"></i></button>
                    </div>
                </div>
                <div class="p-6 flex flex-col gap-2 md:gap-3 flex-1 text-left ${isDisabled ? 'pointer-events-none' : ''}">
                    <span class="text-[8px] md:text-[9px] font-black tracking-[0.2em] uppercase px-2 py-0.5 rounded border text-gray-400 border-gray-500/20 bg-gray-500/5 w-max">${tool.category}</span>
                    <h3 class="text-xl font-bold text-white group-hover:text-brand-accent cursor-pointer transition-colors" onclick="${clickImageAction}">${tool.title}</h3>
                    <p class="text-sm text-gray-400 line-clamp-2 leading-relaxed flex-1">${tool.desc}</p>
                    
                    <div class="pt-3 md:pt-4 mt-auto flex card-btn-container gap-2">
                        <button onclick="window.handleNavClick('tool-${tool.id}')" class="flex-1 py-2 md:py-3 bg-transparent border border-white/10 hover:bg-white/5 rounded-xl text-xs font-bold text-gray-400 flex justify-center items-center gap-2"><i data-lucide="file-text" class="w-3 h-3"></i> Details</button>
                        <button onclick="window.launchNativeSPA('${tool.link || ''}', ${tool.id}, event)" class="flex-1 py-2 md:py-3 bg-white/5 hover:bg-white hover:text-black rounded-xl text-xs font-bold text-white shadow-lg flex justify-center items-center gap-2"><i data-lucide="external-link" class="w-3 h-3"></i> Open</button>
                    </div>
                </div>
            </div>`;
        };

        window.renderToolDetailPage = function(id) {
            const tool = typeof toolsData !== 'undefined' ? toolsData.find(t => t.id === id) : null;
            if(!tool) return window.handleNavClick('home');
            
            document.getElementById('view-content').innerHTML = `
                <div class="px-6 md:px-16 py-8">
                    <div onclick="window.handleNavClick('${tool.category}')" class="cursor-pointer flex items-center gap-2 text-gray-400 hover:text-white transition-colors mb-6 text-sm font-bold w-max">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to ${tool.category}
                    </div>
                    
                    <div class="flex flex-col md:flex-row gap-6 md:gap-10 bg-gradient-to-b from-[#181818] to-[#0a0a0a] border border-white/10 rounded-3xl p-5 md:p-8 relative overflow-hidden max-w-5xl text-left shadow-2xl">
                        <div class="w-full md:w-72 aspect-[4/3] rounded-2xl overflow-hidden shrink-0 border border-white/10 relative z-10 skeleton-bg">
                            <img src="${tool.img}" loading="lazy" onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('skeleton-bg');" class="w-full h-full object-cover opacity-0" style="transition: opacity 0.5s ease;" alt="${tool.title}">
                        </div>
                        <div class="flex flex-col justify-center flex-1 relative z-10">
                            <span class="text-[10px] font-black tracking-[0.2em] uppercase px-3 py-1 rounded border text-gray-400 border-gray-500/20 bg-gray-500/5 w-max mb-4">${tool.category}</span>
                            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tighter mb-4">${tool.title}</h1>
                            <p class="text-sm md:text-lg text-gray-400 mb-6 md:mb-8 leading-relaxed font-medium">${tool.desc}</p>
                            <div class="flex flex-col sm:flex-row gap-3 md:gap-4 w-full md:max-w-md">
                                <button onclick="window.launchNativeSPA('${tool.link || ''}', ${tool.id}, event)" class="flex-1 flex items-center justify-center gap-3 py-3 md:py-4 bg-brand-accent hover:bg-red-600 text-white rounded-xl text-sm md:text-lg font-black transition-transform hover:scale-105 shadow-lg">Launch Tool <i data-lucide="external-link" class="w-5 h-5"></i></button>
                                <button onclick="window.toggleSave(event, ${tool.id})" class="px-6 flex items-center justify-center gap-3 py-3 md:py-4 bg-white/5 border border-white/10 hover:bg-white/10 text-white rounded-xl font-bold transition-all text-sm md:text-base"><i data-lucide="bookmark" class="w-5 h-5"></i> Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.tryCreateIcons();
        };

        window.renderHome = function() {
            let html = `
                <div class="relative z-10 px-6 md:px-16 pt-6 pb-4 text-left max-w-5xl">
                    <h1 class="text-4xl md:text-6xl font-black text-white tracking-tighter mb-4 flex flex-wrap items-center gap-x-3 gap-y-1">
                        <span>The Ultimate</span>
                        <span class="rolling-wrapper-inline min-w-[200px]">
                            <ul class="rolling-list-inline text-brand-accent" id="heroRollingList">
                                <li>Toolkit</li><li>Dashboard</li><li>Workspace</li><li aria-hidden="true">Toolkit</li>
                            </ul>
                        </span>
                    </h1>
                    <p class="text-gray-400 text-base md:text-lg font-medium max-w-2xl mb-8 leading-relaxed">

                    </p> 
                    <div class="relative max-w-2xl mb-12">
                        <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-6 h-6 text-gray-400"></i>
                        <input type="text" id="inline-search-input" placeholder="Search premium tools..." class="w-full bg-[#1c1c1e] border border-white/10 hover:border-brand-accent/30 text-white text-base rounded-full py-4 pl-16 pr-6 focus:outline-none focus:border-brand-accent transition-shadow shadow-lg" autocomplete="off" oninput="window.performInlineSearch()">
                    </div>
                </div>

                <!-- NEW HERO CAROUSEL BANNER -->
                <div id="hero-carousel" class="px-6 md:px-16 pb-12 w-full max-w-6xl">
                    <div class="relative w-full h-48 md:h-72 rounded-3xl overflow-hidden bg-[#1c1c1e] shadow-2xl group border border-white/10">
                        <div id="carousel-track" class="flex w-full h-full transition-transform duration-700 ease-in-out">
                            <!-- Injected below via JS -->
                        </div>
                        <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-transparent to-transparent pointer-events-none"></div>
                        <button onclick="window.moveCarousel(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/50 text-white opacity-0 group-hover:opacity-100 transition-opacity z-20"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                        <button onclick="window.moveCarousel(1)" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/50 text-white opacity-0 group-hover:opacity-100 transition-opacity z-20"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
                    </div>
                </div>

                <div id="search-results-area" class="hidden relative z-50 px-6 md:px-16 pb-20 w-full animate-fade-up min-h-[50vh]">
                    <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                        <h3 class="text-white font-black text-2xl">Search Results</h3>
                    </div>
                    <div id="search-results-grid" class="grid-container text-left justify-start"></div>
                </div>

                <div id="home-main-content">
                    <div class="px-6 md:px-16 pb-8 text-left max-w-5xl flex flex-wrap gap-3">
                        ${categoriesList.map(cat => `<button onclick="window.handleNavClick('${cat.id}')" class="flex items-center gap-2 px-5 py-2.5 rounded-full border border-white/10 bg-[#1c1c1e] hover:bg-white/10 text-xs md:text-sm font-bold text-white shadow-md"><i data-lucide="${cat.icon}" class="w-4 h-4 ${cat.color}"></i> ${cat.title}</button>`).join('')}
                    </div>

                    <div class="px-6 md:px-16 py-10">
            `;

            if (pinnedTools.length > 0) {
                const pTools = typeof toolsData !== 'undefined' ? toolsData.filter(t => pinnedTools.includes(t.id)) : [];
                html += `
                    <section class="mb-16">
                        <h2 class="text-3xl font-black text-white tracking-tight mb-8">Pinned Arsenal</h2>
                        <div class="grid-container">${pTools.map(t => `<div>${window.createCard(t, false, true)}</div>`).join('')}</div>
                    </section>`;
            }

            let trendingTools = typeof toolsData !== 'undefined' ? toolsData.slice(0, 8) : [];
            if(trendingTools.length > 0) {
                html += `
                <section class="mb-16">
                    <h2 class="text-3xl font-black text-white tracking-tight mb-8">Discover Tools</h2>
                    <div class="grid-container">${trendingTools.map(t => `<div>${window.createCard(t)}</div>`).join('')}</div>
                </section>`;
            }

            html += `</div></div>`;
            document.getElementById('view-content').innerHTML = html;
            window.tryCreateIcons();
            window.initHeroCarousel();

            // Rolling Text Logic
            clearInterval(heroSliderInterval);
            heroSliderInterval = setInterval(() => {
                const list = document.getElementById('heroRollingList');
                if(!list) return clearInterval(heroSliderInterval);
                const first = list.firstElementChild;
                list.style.transition = 'transform 0.5s ease';
                list.style.transform = `translateY(-${first.offsetHeight}px)`;
                setTimeout(() => {
                    list.style.transition = 'none';
                    list.style.transform = 'translateY(0)';
                    list.appendChild(first);
                }, 500);
            }, 2500);
        };

        // --- HERO CAROUSEL LOGIC ---
        let currentCarouselIndex = 0;
        let totalCarouselSlides = 0;
        window.initHeroCarousel = function() {
            const track = document.getElementById('carousel-track');
            if(!track || typeof toolsData === 'undefined') return;
            // Get 3 random tools for hero
            const slides = toolsData.slice(0, 3).map(tool => `
                <div class="w-full h-full flex-shrink-0 relative cursor-pointer" onclick="window.launchNativeSPA('${tool.link}', ${tool.id})">
                    <img src="${tool.img}" class="w-full h-full object-cover opacity-60 hover:opacity-80 transition-opacity" />
                    <div class="absolute bottom-6 left-6 md:bottom-10 md:left-10 max-w-lg z-10 pointer-events-none">
                        <span class="bg-brand-accent text-white text-[10px] font-black px-2 py-1 rounded tracking-widest mb-2 inline-block uppercase">Featured</span>
                        <h2 class="text-3xl md:text-5xl font-black text-white mb-2 leading-tight">${tool.title}</h2>
                        <p class="text-gray-300 text-sm hidden md:block">${tool.desc}</p>
                    </div>
                </div>
            `);
            track.innerHTML = slides.join('');
            totalCarouselSlides = slides.length;
            setInterval(() => window.moveCarousel(1), 5000); // Auto-slide
        };

        window.moveCarousel = function(direction) {
            const track = document.getElementById('carousel-track');
            if(!track || totalCarouselSlides === 0) return;
            currentCarouselIndex = (currentCarouselIndex + direction + totalCarouselSlides) % totalCarouselSlides;
            track.style.transform = `translateX(-${currentCarouselIndex * 100}%)`;
        };

        window.renderCategoryPage = function(catId) {
            const cat = categoriesList.find(c => c.id === catId);
            if (!cat) return window.handleNavClick('home');
            const tools = typeof toolsData !== 'undefined' ? toolsData.filter(cat.filter) : [];

            document.getElementById('view-content').innerHTML = `
                <div class="relative w-full h-[35vh] overflow-hidden flex flex-col justify-end px-6 md:px-16 py-10 skeleton-bg">
                    <img src="${cat.img}" class="absolute inset-0 w-full h-full object-cover opacity-60" onload="this.parentElement.classList.remove('skeleton-bg');" alt="${cat.title}">
                    <div class="relative z-20 w-full max-w-7xl text-left">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                                <i data-lucide="${cat.icon}" class="${cat.color} w-6 h-6"></i>
                            </div>
                            <span class="bg-[#1a1a1c] text-white text-xs font-black px-3 py-1.5 rounded-lg border border-white/5">${tools.length} Tools</span>
                        </div>
                        <h1 class="text-4xl md:text-6xl font-black text-white tracking-tighter">${cat.title}</h1>
                    </div>
                </div>
                <div class="px-6 md:px-16 py-12">
                    <div class="grid-container">${tools.map((t) => `<div>${window.createCard(t)}</div>`).join('')}</div>
                </div>
            `;
            window.tryCreateIcons();
        };

        // Modal Function Scopes Fixes
        window.openProjectModal = function() { 
            const modal = document.getElementById('project-modal'); 
            window.lockScroll(); 
            modal.classList.remove('hidden'); 
            setTimeout(() => modal.firstElementChild.style.opacity = '1', 50);
        };
        
        window.closeProjectModal = function() { 
            const modal = document.getElementById('project-modal'); 
            window.unlockScroll(); 
            modal.firstElementChild.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        window.triggerDeleteProject = function(event, id) {
            if(event) event.stopPropagation();
            projectToDeleteId = id; 
            const modal = document.getElementById('delete-modal'); 
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('delete-modal-content').style.opacity = '1', 50);
            
            document.getElementById('confirm-delete-btn').onclick = () => {
                myProjects = myProjects.filter(p => p.id !== projectToDeleteId); 
                localStorage.setItem('forgenos_projects', JSON.stringify(myProjects));
                window.closeDeleteModal(); 
                if(currentOpenProjectId === projectToDeleteId) window.closeInnerProject(); 
                window.renderProjectsView(); window.showToast("Toolkit Deleted", 'alert');
            };
        };

        window.closeDeleteModal = function() { 
            const modal = document.getElementById('delete-modal'); 
            document.getElementById('delete-modal-content').style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 200); 
        };

        window.renderSettings = function() { document.getElementById('view-content').innerHTML = `<div class="px-16 py-20"><h1 class="text-5xl font-black text-white">Settings</h1><p class="text-gray-400 mt-4">Feature settings manage dynamically in UI.</p></div>`; };
        window.renderProjectsView = function() { document.getElementById('view-content').innerHTML = `<div class="px-16 py-20"><h1 class="text-5xl font-black text-white">My Projects</h1><p class="text-gray-400 mt-4">Bundle your favourite items here.</p></div>`; };
        window.renderSavedView = function() { document.getElementById('view-content').innerHTML = `<div class="px-16 py-20"><h1 class="text-5xl font-black text-white">Saved Tools</h1><p class="text-gray-400 mt-4">Tools you bookmarked.</p></div>`; };

        window.playLogoAnim = function() {
            if (typeof gsap === 'undefined') return;
            gsap.killTweensOf('.forgenos-shape-left, .forgenos-shape-right, .forgenos-logo-svg');
            gsap.set('.forgenos-shape-left', { x: 0, y: 0 });
            gsap.set('.forgenos-shape-right', { x: 0, y: 0 });
            gsap.set('.forgenos-logo-svg', { scale: 1, filter: 'none' });
            const lefts  = document.querySelectorAll('.forgenos-shape-left');
            const rights = document.querySelectorAll('.forgenos-shape-right');
            const svgs   = document.querySelectorAll('.forgenos-logo-svg');
            const tl = gsap.timeline();
            tl.to(lefts,  { x: -8, y: 8,  duration: 0.18, ease: 'power2.out' })
              .to(rights, { x: 8,  y: -8, duration: 0.18, ease: 'power2.out' }, 0)
              .to(lefts,  { x: 0, y: 0, duration: 0.3, ease: 'back.out(3)' })
              .to(rights, { x: 0, y: 0, duration: 0.3, ease: 'back.out(3)' }, '-=0.3')
              .to(svgs, { scale: 1.15, filter: 'drop-shadow(0px 0px 14px rgba(249,115,22,0.6))', duration: 0.18 }, '-=0.2')
              .to(svgs, { scale: 1, filter: 'none', duration: 0.35, delay: 0.25, ease: 'power2.out' });
        };

        window.onload = () => {
            // Priority check for routed clean URL
            if (window.location.hash && window.location.hash.match(/^#\/[a-zA-Z0-9_-]+\/.+\.html/)) {
                const parts = window.location.hash.split('/');
                const fileName = parts.slice(2).join('/');
                const tool = typeof toolsData !== 'undefined' ? toolsData.find(t => t.link && t.link.includes(fileName)) : null;
                if(tool) {
                    document.getElementById('app-root').classList.remove('opacity-0');
                    window.renderSidebar(); 
                    window.launchNativeSPA(tool.link, tool.id, null);
                    return; 
                }
            }

            let initialView = 'home';
            if (window.location.hash) {
                const hashView = window.location.hash.substring(1);
                if (!hashView.includes('/')) initialView = hashView;
            }

            history.replaceState({view: initialView}, '', '#' + initialView);
            currentView = initialView;
            window.triggerPageLoader(); 
            executeRenderView(initialView);

            const footer = document.getElementById('main-footer');
            if(footer) footer.style.display = (initialView === 'home') ? 'block' : 'none';

            window.renderSidebar(); 
            window.tryCreateIcons();
        };
    </script>
</body>
</html>
